name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests with coverage
        run: >
          dotnet test apps/backend/tests/RetailOps.UnitTests/RetailOps.UnitTests.csproj
          -c Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Integration tests
        run: dotnet test apps/backend/tests/RetailOps.IntegrationTests/RetailOps.IntegrationTests.csproj -c Release --no-build
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Database=test_db;Username=test;Password=test

  web-vue:
    name: Frontend (Vue)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web-vue/package-lock.json

      - name: Install dependencies
        working-directory: apps/web-vue
        run: npm ci

      - name: Build
        working-directory: apps/web-vue
        run: npm run build

      - name: Unit tests
        working-directory: apps/web-vue
        run: npm run test:unit

  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle assembleDebug
        working-directory: apps/mobile-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: retailops-debug-apk
          path: apps/mobile-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  docker-build:
    name: Docker images (smoke build)
    runs-on: ubuntu-latest
    needs: [backend, web-vue]

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          for attempt in 1 2 3; do
            if docker build -f apps/backend/RetailOps.Api/Dockerfile .; then
              exit 0
            fi
            echo "Docker build attempt ${attempt} failed; retrying in ${attempt}0s..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build Web image
        run: |
          for attempt in 1 2 3; do
            if docker build -f apps/web-vue/Dockerfile .; then
              exit 0
            fi
            echo "Docker build attempt ${attempt} failed; retrying in ${attempt}0s..."
            sleep $((attempt * 10))
          done
          exit 1
