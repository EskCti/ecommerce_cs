name: CD

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-api:
    name: Push API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/RetailOps.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/retailops-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/retailops-api:latest

  build-and-push-web:
    name: Push Web image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web-vue/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/retailops-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/retailops-web:latest

  build-android-release:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle assembleDebug
        working-directory: apps/mobile-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: retailops-apk
          path: apps/mobile-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
